scalar datetime

type Author{
    _id: String!
    name: String!
    DOB: datetime
    email: String!
}

type Book{
    _id: String!
    name: String!
    genre: String!
    author: Author!
    published_year: datetime!
    created_at: datetime!
    updated_at: datetime!
}

type User{
  googleId: String!
  email: String!
  name: String!
  picture: String
}

# query
type Query{
    authors: [Author!]!
    author(_id: String!): Author
    books: [Book!]!
    book(_id: String!): Book
    me: User
}

# mutation
input CreateAuthorInput {
  name: String!
  DOB: datetime!
  email: String!
}
input UpdateAuthorInput {
  name: String!
  DOB: datetime!
  email: String!
}
input CreateBookInput {
  name: String!
  genre: String!
  author_id: String!
  published_year: datetime!
}
input UpdateBookInput {
  name: String!
  genre: String!
  author_id: String!
  published_year: datetime!
}
input SendEmailInput {
  email: String!
}

type EmailResponse {
  success: Boolean!
  message: String!
}

type Mutation{
    createAuthor(input: CreateAuthorInput!): Author!
    createBook(input: CreateBookInput!): Book!
    updateAuthor(_id: String!, input: UpdateAuthorInput!): Author!
    updateBook(_id: String!, input: UpdateBookInput!): Book!
    sendEmail(input: SendEmailInput!): EmailResponse!
}